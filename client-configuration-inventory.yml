# Which settings of the Camunda 7 engine this adapter passes on to its users, and which it does
# not.
#
# The adapter builds the engine itself and reads only its own keys, 'vanillabp.adapters.<id>.*'.
# So a setting which a new engine version adds reaches a user only when the adapter gets a key for
# it. The script .github/client-configuration/check.py reads the settings out of the engine jars.
# The job 'client-configuration' of .github/workflows/checks.yaml runs it on every pull request.
# When a pull request changes 'camunda.version', it compares the two versions and opens an issue
# labelled 'client-configuration' for each new setting which this file does not list yet.
#
# Every setting is listed once, under one of four answers:
#
#   supported       the adapter has a key which sets it ('key')
#   set-by-adapter  the adapter sets it itself ('reason')
#   not-supported   why a user of the adapter does not need it ('reason')
#   open            the issue which decides it ('issue')
#
# The file ends in '.yml' on purpose. Spotless formats every '*.yaml' file through Jackson, which
# drops the comments, and the comments here are half of the answers.
#
# A group shares one answer, but it names each of its settings. So a new setting never falls into
# a group without somebody writing its name down here.
#
# Many answers name a ProcessEnginePlugin. That is the way an application reaches any setting of
# the engine which has no key, see the wiki page Configuration.
client:
  name: Camunda
  # where the pull request finds the engine version, in the root pom.xml
  version-properties:
    - camunda.version
  # https://github.com/orgs/vanillabp/projects/3, where the issues belong
  project: 3
  # what an issue suggests as the key of a new setting
  suggested-key-prefix: vanillabp.adapters.<id>.
# A comparison whose result is known. The job runs it first, so that a check which reads nothing
# cannot look like a version without news.
self-test:
  old: 7.23.0
  new: 7.24.0
  new-settings:
    engine:
      - legacyJobRetryBehaviorEnabled
    starter:
      - camunda.bpm.rest-api.fetch-and-lock.queue-capacity
# What the script reads.
surfaces:
  # The public setters of the classes the adapter builds the engine from, on Spring Boot and on
  # Quarkus, together with every superclass: ProcessEngineConfigurationImpl and
  # ProcessEngineConfiguration.
  - id: engine
    title: engine setting
    read: setters
    artifacts:
      - org.camunda.bpm:camunda-engine
      - org.camunda.bpm:camunda-engine-spring-6
    classes:
      - org.camunda.bpm.engine.spring.SpringProcessEngineConfiguration
      - org.camunda.bpm.engine.impl.cfg.JakartaTransactionProcessEngineConfiguration
  # The properties of Camunda's Spring Boot starter, from its Spring configuration metadata. The
  # adapter does not build its engine with the starter. But the starter is the best list of what
  # Camunda thinks a user wants to set.
  - id: starter
    title: Spring Boot starter property
    read: spring-metadata
    artifacts:
      - org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter
    prefix: camunda.bpm.
settings:
  engine:
    supported:
      - names: [databaseSchemaUpdate]
        key: vanillabp.adapters.<id>.database-schema-update
      - names: [historyTimeToLive]
        key: vanillabp.adapters.<id>.history-time-to-live
      - names: [history, historyLevel]
        key: vanillabp.adapters.<id>.history-level
      - names: [dataSource]
        key: vanillabp.adapters.<id>.data-source-name
      - names: [databaseTablePrefix]
        key: vanillabp.adapters.<id>.table-prefix
      - names: [defaultSerializationFormat]
        key: vanillabp.adapters.<id>.serialization-format
      - names: [processEnginePlugins]
        key: vanillabp.adapters.<id>.engine-plugins
      - names: [dbMetricsReporterActivate]
        key: vanillabp.adapters.<id>.db-metrics-reporting
      - names: [dmnFeelEnableLegacyBehavior]
        key: vanillabp.adapters.<id>.dmn-feel-legacy-behavior
      - names: [jobExecutorAcquireByDueDate]
        key: vanillabp.adapters.<id>.sleep-until-something-is-due
    # A ProcessEnginePlugin of the application which changes one of the settings below ends the
    # start. The message names the setting, the adapter's value and the plugin. With
    # 'vanillabp.adapters.<id>.allow-plugins-to-change-adapter-settings: true' the start goes on, with
    # a WARN for each changed setting. A plugin may add entries to a list, but it may not remove the
    # adapter's. The watch is Camunda7AdapterSettingsGuard, see DECISIONS.pending/2119.md.
    set-by-adapter:
      - names:
          - applicationContext
          - classLoader
          - processEngineName
          - transactionManager
          - transactionsExternallyManaged
        reason: >-
          The adapter connects the engine to the application: to the Spring context and its class
          loader or the class loader of Quarkus, and to the transaction manager of the platform. It names the engine after
          the adapter type and the adapter id, so that the engines of several adapter ids stay apart.
      - names:
          - customPostBPMNParseListeners
          - customPreBPMNParseListeners
          - expressionManager
          - historyEventHandler
        reason: >-
          This is how the adapter connects a BPMN model to the workflow task methods, and how an
          extension adds its parse listeners and history event handlers through an engine customizer
          bean. A value set from outside would cut these connections.
      - names:
          - customPostCommandInterceptorsTxRequired
          - customPostCommandInterceptorsTxRequiresNew
          - jobExecutor
          - jobExecutorActivate
        reason: >-
          The adapter brings its own job executor and starts it when workflow processing starts, not
          when the engine is built. The command interceptors wake that job executor after a commit,
          see 'sleep-until-something-is-due'.
      - names: [idGenerator]
        reason: >-
          The adapter uses the StrongUuidGenerator, so ids are UUIDs as in version 1, where Camunda's
          Spring Boot starter built the engine. The ids of a database which version 1 set up keep one
          form, and several engines on one database do not compete for blocks of ids. An application which
          wants another generator sets it with a ProcessEnginePlugin and
          'vanillabp.adapters.<id>.allow-plugins-to-change-adapter-settings: true'.
      - names: [jobExecutorDeploymentAware]
        reason: >-
          Always true, as recommended for version 1. The job executor fetches only the jobs of the
          deployments registered with it, and the adapter registers every deployment of the
          application's workflow modules, the older versions included. During a rolling update a node
          with the old code then leaves the jobs of a newer version alone. There is no key to switch
          it off, and a plugin which does ends the start.
