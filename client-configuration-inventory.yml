          - camunda.bpm.job-execution.wait-increase-factor
          - camunda.bpm.job-execution.wait-time-in-millis
        reason: >-
          How the job executor acquires and locks jobs. The adapter's job executor works with the
          defaults of the engine. An application which needs another value sets it with a
          ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - camunda.bpm.eventing.execution
          - camunda.bpm.eventing.history
          - camunda.bpm.eventing.skippable
          - camunda.bpm.eventing.task
        reason: >-
          The starter publishes engine events as Spring events. The adapter does not use the starter,
          and VanillaBP reports what happens in a workflow through its own listeners.
      - names: [camunda.bpm.filter.create]
        reason: >-
          Creates a filter for the tasklist on the first start. The adapter does not use the starter,
          and an application creates its filters in the tasklist.
      - names: [camunda.bpm.license-file]
        reason: >-
          Only for the enterprise edition of the web applications, and the adapter does not use the
          starter.
      - names: [camunda.bpm.generate-unique-process-application-name]
        reason: VanillaBP does not use process applications.
      - names:
