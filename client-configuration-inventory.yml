      - names:
          - artifactFactory
          - authorizationService
          - batchHandlers
          - batchWindowManager
          - beans
          - bpmnParseFactory
          - businessCalendarManager
          - cacheFactory
          - caseService
          - cmmnHistoryEventProducer
          - commandCheckers
          - commandContextFactory
          - commandExecutorSchemaOperations
          - commandExecutorTxRequired
          - commandExecutorTxRequiresNew
          - commandInterceptorsTxRequired
          - commandInterceptorsTxRequiresNew
          - conditionHandler
          - correlationHandler
          - dbMetricsReporter
          - dbSchemaOperationsCommandContextFactory
          - dbSqlSessionFactory
          - decisionService
          - deployers
          - deploymentCache
          - deploymentHandlerFactory
          - diagnosticsCollector
          - diagnosticsRegistry
          - dmnEngine
          - dmnEngineConfiguration
          - dmnHistoryEventProducer
          - eventHandlers
          - externalTaskService
          - filterService
          - formEngines
          - formService
          - formTypes
          - formValidators
          - historyEventProducer
          - historyLevelCommand
          - historyService
          - identityProviderSessionFactory
          - identityService
          - incidentHandlers
          - jobHandlers
          - managementService
          - metricsRegistry
          - migratingActivityInstanceValidators
          - migrationActivityMatcher
          - migrationInstructionGenerator
          - migrationInstructionValidators
          - postParseListeners
          - preParseListeners
          - processApplicationManager
          - processEngineBootstrapCommand
          - registeredDeployments
          - repositoryService
          - runtimeService
          - schemaOperationsCommand
          - scriptFactory
          - scriptingEngines
          - scriptingEnvironment
          - sessionFactories
          - sqlSessionFactory
          - taskService
          - telemetryData
          - transactionContextFactory
          - transactionFactory
          - useSharedSqlSessionFactory
          - valueTypeResolver
          - variableTypes
        reason: >-
          Parts which the engine builds for itself: services, command executors and interceptors,
          session factories, caches, the DMN engine, the lists of handlers it fills at start.
          Replacing one changes how the engine works inside. That is work for a ProcessEnginePlugin,
          not configuration, so a key would help nobody.
      - names:
          - builtinExceptionCodeProvider
          - customBatchJobHandlers
          - customEventHandlers
          - customExceptionCodeProvider
          - customFormEngines
          - customFormFieldValidators
          - customFormTypes
          - customHistoryEventHandlers
          - customHistoryLevels
          - customIncidentHandlers
          - customJobHandlers
          - customPasswordChecker
          - customPostCmmnTransformListeners
          - customPostDeployers
          - customPostMigratingActivityInstanceValidators
          - customPostMigrationActivityValidators
          - customPostMigrationInstructionValidators
          - customPostVariableSerializers
          - customPreCmmnTransformListeners
          - customPreCommandInterceptorsTxRequired
          - customPreCommandInterceptorsTxRequiresNew
          - customPreDeployers
          - customPreMigratingActivityInstanceValidators
          - customPreMigrationActivityValidators
          - customPreMigrationInstructionValidators
          - customPreVariableSerializers
          - customRejectedJobsHandler
          - customSessionFactories
          - delegateInterceptor
          - deserializationTypeValidator
          - dmnElProvider
          - dmnFeelCustomFunctionProviders
          - envScriptResolvers
          - externalTaskPriorityProvider
          - failedJobCommandFactory
          - fallbackSerializerFactory
          - historyRemovalTimeProvider
          - hostnameProvider
          - jobPriorityProvider
          - metricsReporterIdProvider
          - passwordEncryptor
          - passwordManager
          - passwordPolicy
          - permissionProvider
          - resolverFactories
          - resourceAuthorizationProvider
          - saltGenerator
          - scriptEngineResolver
          - tenantIdProvider
        reason: >-
          These take Java objects, not values: handlers, providers, validators, listeners and
          serializers. A configuration key cannot carry an object. An application which needs another
          value sets it with a ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - dataSourceJndiName
          - databaseType
          - databaseVendor
          - databaseVersion
          - forceCloseMybatisConnectionPool
          - idGeneratorDataSource
          - idGeneratorDataSourceJndiName
          - jdbcDriver
          - jdbcMaxActiveConnections
          - jdbcMaxCheckoutTime
          - jdbcMaxIdleConnections
          - jdbcMaxWaitTime
          - jdbcPassword
          - jdbcPingConnectionNotUsedFor
          - jdbcPingEnabled
          - jdbcPingQuery
          - jdbcUrl
          - jdbcUsername
          - transactionManagerJndiName
        reason: >-
          The engine runs on a datasource which the application or the runtime provides, see
          'vanillabp.adapters.<id>.data-source-name'. The connection and the pool belong to that
          datasource, and the engine finds out the type of the database from it.
      - names:
          - adminGroups
          - adminUsers
          - authorizationCheckRevokes
          - authorizationEnabled
          - authorizationEnabledForCustomCode
          - dbIdentityUsed
          - defaultUserPermissionForTask
          - defaultUserPermissionNameForTask
          - disabledPermissions
          - enableHistoricInstancePermissions
          - enablePasswordPolicy
          - enforceSpecificVariablePermission
          - generalResourceWhitelistPattern
          - groupResourceWhitelistPattern
          - loginDelayBase
          - loginDelayFactor
          - loginDelayMaxTime
          - loginMaxAttempts
          - restrictUserOperationLogToAuthenticatedUsers
          - tenantCheckEnabled
          - tenantResourceWhitelistPattern
          - userResourceWhitelistPattern
          - webappsAuthenticationLoggingEnabled
        reason: >-
          Authorizations, users, passwords and logins protect the APIs of the engine against a logged-
          in user, as in the web applications. The adapter calls the engine without a logged-in user,
          so these do not change what it does. An application which needs another value sets it with a
          ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - batchOperationHistoryTimeToLive
          - batchOperationsForHistoryCleanup
          - dbHistoryUsed
          - enableDefaultDbHistoryEventHandler
          - enforceHistoryTimeToLive
          - fridayHistoryCleanupBatchWindowEndTime
          - fridayHistoryCleanupBatchWindowStartTime
          - historyCleanupBatchSize
          - historyCleanupBatchThreshold
          - historyCleanupBatchWindowEndTime
          - historyCleanupBatchWindowEndTimeAsDate
          - historyCleanupBatchWindowStartTime
          - historyCleanupBatchWindowStartTimeAsDate
          - historyCleanupBatchWindows
          - historyCleanupDefaultNumberOfRetries
          - historyCleanupDegreeOfParallelism
          - historyCleanupEnabled
          - historyCleanupJobLogTimeToLive
          - historyCleanupJobPriority
          - historyCleanupMetricsEnabled
          - historyCleanupStrategy
          - historyRemovalTimeStrategy
          - mondayHistoryCleanupBatchWindowEndTime
          - mondayHistoryCleanupBatchWindowStartTime
          - parsedBatchOperationsForHistoryCleanup
          - parsedTaskMetricsTimeToLive
          - removalTimeUpdateChunkSize
          - saturdayHistoryCleanupBatchWindowEndTime
          - saturdayHistoryCleanupBatchWindowStartTime
          - skipHistoryOptimisticLockingExceptions
          - sundayHistoryCleanupBatchWindowEndTime
          - sundayHistoryCleanupBatchWindowStartTime
          - taskMetricsTimeToLive
          - thursdayHistoryCleanupBatchWindowEndTime
          - thursdayHistoryCleanupBatchWindowStartTime
          - tuesdayHistoryCleanupBatchWindowEndTime
          - tuesdayHistoryCleanupBatchWindowStartTime
          - wednesdayHistoryCleanupBatchWindowEndTime
          - wednesdayHistoryCleanupBatchWindowStartTime
        reason: >-
          When the engine removes its history again. The adapter works with the defaults of the engine.
          Only 'history-time-to-live' has a key, because the engine refuses a model without one. How
          much history the engine writes has the key 'history-level'. An application which needs another value sets it with a
          ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - batchJobPriority
          - batchJobsPerSeed
          - batchPollTime
          - compositeIncidentHandlersEnabled
          - createIncidentOnFailedJobEnabled
          - defaultNumberOfRetries
          - ensureJobDueDateNotNull
          - failedJobListenerMaxRetries
          - failedJobRetryTimeCycle
          - hintJobExecutor
          - invocationsPerBatchJob
          - invocationsPerBatchJobByBatchType
          - jobExecutorAcquireByPriority
          - jobExecutorAcquireExclusiveOverProcessHierarchies
          - jobExecutorPreferTimerJobs
          - jobExecutorPriorityRangeMax
          - jobExecutorPriorityRangeMin
          - legacyJobRetryBehaviorEnabled
          - producePrioritizedExternalTasks
          - producePrioritizedJobs
          - reevaluateTimeCycleWhenDue
        reason: >-
          How the engine picks, orders and retries its jobs and batches. The adapter is built and
          tested with the defaults of the engine. An application which needs another value sets it
          with a ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - autoStoreScriptVariables
          - configureScriptEngineHostAccess
          - enableExpressionsInAdhocQueries
          - enableExpressionsInStoredQueries
          - enableFetchScriptEngineFromProcessApplication
          - enableScriptCompilation
          - enableScriptEngineCaching
          - enableScriptEngineLoadExternalResources
          - enableScriptEngineNashornCompatibility
          - scriptEngineNameJavaScript
        reason: >-
          Scripts and expressions inside a model or a query. VanillaBP binds a task to a Java method
          and needs none of these, so the defaults of the engine apply. An application which needs
          another value sets it with a ProcessEnginePlugin: as a bean on Spring Boot, or as a class
          under 'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - bpmnStacktraceVerbose
          - enableCmdExceptionLogging
          - enableReducedJobExceptionLogging
          - hostname
          - installationId
          - logEntriesPerSyncOperationLimit
          - logLevelBpmnStackTrace
          - loggingContextActivityId
          - loggingContextActivityName
          - loggingContextApplicationName
          - loggingContextBusinessKey
          - loggingContextEngineName
          - loggingContextProcessDefinitionId
          - loggingContextProcessDefinitionKey
          - loggingContextProcessInstanceId
          - loggingContextTenantId
          - metricsEnabled
          - taskMetricsEnabled
        reason: >-
          What the engine logs, which names it puts into the logging context, and what it counts as
          metrics. The adapter logs on its own, and the defaults of the engine apply. An application
          which needs another value sets it with a ProcessEnginePlugin: as a bean on Spring Boot, or
          as a class under 'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - cmmnEnabled
          - disableStrictCamundaFormParsing
          - dmnEnabled
          - enableFetchProcessDefinitionDescription
          - mailServerDefaultFrom
          - mailServerHost
          - mailServerPassword
          - mailServerPort
          - mailServerUseTLS
          - mailServerUsername
          - standaloneTasksEnabled
          - wsSyncFactoryClassName
        reason: >-
          Switches for parts of the engine which VanillaBP does not change: CMMN, DMN, tasks without a
          process, the mail service, forms and web services. VanillaBP uses BPMN and DMN with the
          defaults of the engine. An application which needs another value sets it with a
          ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - createDiagramOnDeploy
          - deployChangedOnly
          - deploymentLockUsed
          - deploymentName
          - deploymentResources
          - deploymentSynchronized
          - deploymentTenantId
        reason: >-
          How the engine deploys models, and the automatic deployment of Spring. VanillaBP deploys the
          models of each workflow module itself and decides on its own what changed, so it needs none
          of these.
      - names:
          - cacheCapacity
          - databaseSchema
          - dbEntityCacheKeyMapping
          - dbEntityCacheReuseEnabled
          - defaultCharset
          - defaultCharsetName
          - deserializationAllowedClasses
          - deserializationAllowedPackages
          - deserializationTypeValidationEnabled
          - disableBuiltinExceptionCodeProvider
          - disableExceptionCode
          - disableStrictCallActivityValidation
          - dmnReturnBlankTableOutputAsNull
          - enableExceptionsAfterUnhandledBpmnError
          - enableGracefulDegradationOnContextSwitchFailure
          - enableOptimisticLockingOnForeignKeyViolation
          - enableXxeProcessing
          - executionTreePrefetchEnabled
          - idBlockSize
          - implicitVariableUpdateDetectionEnabled
          - invokeCustomVariableListeners
          - javaSerializationFormatEnabled
          - jdbcBatchProcessing
          - jdbcStatementTimeout
          - queryMaxResultsLimit
          - skipIsolationLevelCheck
          - skipOutputMappingOnCanceledActivities
        reason: >-
          How the engine behaves inside and how fast it is: caches, blocks of ids, JDBC statements,
          limits of serialization and XML parsing, and similar. The adapter is built and tested with
          the defaults of the engine. An application which needs another value sets it with a
          ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
  starter:
    supported:
      - names: [camunda.bpm.database.schema-update]
        key: vanillabp.adapters.<id>.database-schema-update
      - names: [camunda.bpm.database.table-prefix]
        key: vanillabp.adapters.<id>.table-prefix
      - names: [camunda.bpm.default-serialization-format]
        key: vanillabp.adapters.<id>.serialization-format
      - names: [camunda.bpm.history-level]
        key: vanillabp.adapters.<id>.history-level
      - names: [camunda.bpm.metrics.db-reporter-activate]
        key: vanillabp.adapters.<id>.db-metrics-reporting
      - names: [camunda.bpm.admin-user.id]
        key: vanillabp.adapters.<id>.webapps.admin-user.id (module spring-boot-webapps)
      - names: [camunda.bpm.admin-user.password]
        key: vanillabp.adapters.<id>.webapps.admin-user.password (module spring-boot-webapps)
      - names: [camunda.bpm.admin-user.first-name]
        key: vanillabp.adapters.<id>.webapps.admin-user.first-name (module spring-boot-webapps)
      - names: [camunda.bpm.admin-user.last-name]
        key: vanillabp.adapters.<id>.webapps.admin-user.last-name (module spring-boot-webapps)
      - names: [camunda.bpm.admin-user.email]
        key: vanillabp.adapters.<id>.webapps.admin-user.email (module spring-boot-webapps)
      - names:
          - camunda.bpm.webapp.application-path
          - camunda.bpm.webapp.auth.cache.time-to-live
          - camunda.bpm.webapp.auth.cache.ttl-enabled
          - camunda.bpm.webapp.csrf.cookie-name
          - camunda.bpm.webapp.csrf.deny-status
          - camunda.bpm.webapp.csrf.enable-same-site-cookie
          - camunda.bpm.webapp.csrf.enable-secure-cookie
          - camunda.bpm.webapp.csrf.entry-points
          - camunda.bpm.webapp.csrf.init-params
          - camunda.bpm.webapp.csrf.random-class
          - camunda.bpm.webapp.csrf.same-site-cookie-option
          - camunda.bpm.webapp.csrf.same-site-cookie-value
          - camunda.bpm.webapp.csrf.target-origin
          - camunda.bpm.webapp.header-security.content-security-policy-disabled
          - camunda.bpm.webapp.header-security.content-security-policy-value
          - camunda.bpm.webapp.header-security.content-type-options-disabled
          - camunda.bpm.webapp.header-security.content-type-options-value
          - camunda.bpm.webapp.header-security.hsts-disabled
          - camunda.bpm.webapp.header-security.hsts-include-subdomains-disabled
          - camunda.bpm.webapp.header-security.hsts-max-age
          - camunda.bpm.webapp.header-security.hsts-value
          - camunda.bpm.webapp.header-security.init-params
          - camunda.bpm.webapp.header-security.xss-protection-disabled
          - camunda.bpm.webapp.header-security.xss-protection-option
          - camunda.bpm.webapp.header-security.xss-protection-value
          - camunda.bpm.webapp.index-redirect-enabled
          - camunda.bpm.webapp.security-config-file
          - camunda.bpm.webapp.session-cookie.cookie-name
          - camunda.bpm.webapp.session-cookie.enable-same-site-cookie
          - camunda.bpm.webapp.session-cookie.enable-secure-cookie
          - camunda.bpm.webapp.session-cookie.init-params
          - camunda.bpm.webapp.session-cookie.same-site-cookie-option
          - camunda.bpm.webapp.session-cookie.same-site-cookie-value
          - camunda.bpm.webapp.webjar-classpath
        key: >-
          camunda.bpm.webapp.*, the key itself. The module spring-boot-webapps binds the properties of
          the starter, so the webapp auto-configuration of Camunda reads these keys as they are.
          Spring Boot only.
    set-by-adapter:
      - names: [camunda.bpm.enabled]
        reason: >-
          The module spring-boot-webapps sets it to false, because VanillaBP builds the engines. The
          auto-configuration of the starter would build a second engine on the same datasource.
      - names:
          - camunda.bpm.generate-unique-process-engine-name
          - camunda.bpm.process-engine-name
        reason: >-
          The adapter names the engine after the adapter type and the adapter id, so that the engines
          of several adapter ids stay apart.
      - names: [camunda.bpm.job-execution.deployment-aware]
        reason: >-
          The adapter always works deployment-aware, see 'jobExecutorDeploymentAware' on the engine
          surface.
      - names:
          - camunda.bpm.job-execution.core-pool-size
          - camunda.bpm.job-execution.enabled
          - camunda.bpm.job-execution.keep-alive-seconds
          - camunda.bpm.job-execution.max-pool-size
          - camunda.bpm.job-execution.queue-capacity
        reason: >-
          The adapter brings its own job executor with its own thread pool, and starts it when
          workflow processing starts.
      - names:
          - camunda.bpm.auto-deployment-enabled
          - camunda.bpm.deployment-resource-pattern
        reason: VanillaBP deploys the models of each workflow module itself.
      - names: [camunda.bpm.id-generator]
        reason: >-
          The adapter uses the StrongUuidGenerator, which is the starter's default 'strong'. So ids
          are UUIDs as in version 1.
    not-supported:
      - names:
          - camunda.bpm.generic-properties.ignore-unknown-fields
          - camunda.bpm.generic-properties.properties
        reason: >-
          The starter's way to set any setting of the engine by its name. The adapter does not use the
          starter to build its engine. An application which needs another value sets it with a
          ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - camunda.bpm.authorization.authorization-check-revokes
          - camunda.bpm.authorization.enabled
          - camunda.bpm.authorization.enabled-for-custom-code
          - camunda.bpm.authorization.tenant-check-enabled
        reason: >-
          Authorizations protect the APIs of the engine against a logged-in user, as in the web
          applications. The adapter calls the engine without a logged-in user. An application which
          needs another value sets it with a ProcessEnginePlugin: as a bean on Spring Boot, or as a
          class under 'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names: [camunda.bpm.history-level-default]
        reason: >-
          The level the starter uses for 'auto' on a new database. With 'history-level: auto' the
          adapter's engine uses the engine's default 'audit' there. An application which wants
          another level on a new database sets that level instead of 'auto'.
      - names:
          - camunda.bpm.database.jdbc-batch-processing
          - camunda.bpm.database.schema-name
          - camunda.bpm.database.type
          - camunda.bpm.default-number-of-retries
          - camunda.bpm.job-executor-acquire-by-priority
          - camunda.bpm.metrics.enabled
        reason: >-
          Settings of the engine which keep their defaults; the engine surface of this file says why
          for each of them. An application which needs another value sets it with a
          ProcessEnginePlugin: as a bean on Spring Boot, or as a class under
          'vanillabp.adapters.<id>.engine-plugins' on both platforms.
      - names:
          - camunda.bpm.job-execution.backoff-decrease-threshold
          - camunda.bpm.job-execution.backoff-time-in-millis
          - camunda.bpm.job-execution.lock-time-in-millis
          - camunda.bpm.job-execution.max-backoff
          - camunda.bpm.job-execution.max-jobs-per-acquisition
