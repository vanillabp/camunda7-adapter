name: Release 🚀
# A release is started by hand and does three things: it publishes the artifacts to Maven
# Central from a release branch, it leaves a tag and a draft release behind, and it opens
# the pull request which carries the version bump back into main.
#
# It cannot run while any version in a POM is a SNAPSHOT. This repository's own version is
# set by the workflow, so a SNAPSHOT left over is a dependency on an unreleased VanillaBP:
# spi-for-java or the platform. Maven Central refuses such a dependency, and it refuses it
# after the build, which is why the check below ends the run before anything is signed.
"on":
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release (e.g. 2.0.0)
        required: true
      train:
        description: "Release train, e.g. 2.0. Empty: this release uploads to Maven Central itself. Set: the bundle is kept for release-train.yaml in maven-release-parent. Release the repositories of a train in the order of their dependencies: each release reads the bundles of the releases before it."
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". The runner image
      # ships 3.10 now, so the release brings its own 3.9. Remove this step once a plugin
      # version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Extract last released version
        run: |
          apiUrl="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          lastReleasedVersionApiResult=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${apiUrl}")
          lastReleasedVersion=$(echo "${lastReleasedVersionApiResult}" \
            | jq -r '.tag_name')
          if [ "${lastReleasedVersion}" = "null" ] || [ -z "${lastReleasedVersion}" ]; then
            echo "No GitHub release found using ${apiUrl}, falling back to first commit"

            git fetch --quiet --depth=1 origin
            firstCommit=$(git rev-list --max-parents=0 HEAD)

            lastReleasedVersion="${firstCommit}"
          else
            lastReleasedVersion="${lastReleasedVersion#v}"
          fi
          echo "LAST_RELEASED_VERSION=${lastReleasedVersion}" >> "${GITHUB_ENV}"
          echo "Last released version: ${lastReleasedVersion}"
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
          cache: maven
          server-id: vanillabp-central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
          gpg-private-key: "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}"
      - name: Create release branch
        run: |
          git checkout -b release/${{ github.event.inputs.release_version }} origin/main
      - name: Set Maven release version
        run: |
          mvn --batch-mode --update-snapshots versions:set -DprocessAllModules=true -DnewVersion=${{ github.event.inputs.release_version }}
          find . -name pom.xml.versionsBackup -delete
      - name: Refuse a release which depends on something unreleased
        run: |
          SNAPSHOT_POMS=$(grep -R "<.*>.*SNAPSHOT<\/.*>" . --include=pom.xml || true)

          if [ -n "$SNAPSHOT_POMS" ]; then
            echo "::error::A SNAPSHOT is left in a POM, so this release would depend on an unreleased VanillaBP. Release what it points at first (spi-for-java and the platform), then raise the versions here:"
            echo "$SNAPSHOT_POMS"
            exit 1
          fi
          echo "✅ No SNAPSHOT dependencies found."
      # A release train builds the bundle of each release and keeps it as an Actions artifact.
      # release-train.yaml in maven-release-parent uploads the bundles of all repositories of
      # a train as one deployment, because Sonatype allows only a few deployments a month.
      # The bundles of the train which are already there go into the local Maven repository,
      # so this build finds the versions which are not on Maven Central yet. See the README
      # of maven-release-parent.
      - name: Read the bundles of the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "main"
          # reads the Actions artifacts of the other repositories, which GITHUB_TOKEN cannot
          GH_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
        run: |
          # the shared part of a release train lives once, in maven-release-parent
          curl -fsSL -o "$RUNNER_TEMP/release-train.sh" \
            https://raw.githubusercontent.com/vanillabp/maven-release-parent/main/.github/scripts/release-train.sh
          bash "$RUNNER_TEMP/release-train.sh" prepare "$TRAIN" "$LINE"
      - name: Build & deploy to Maven Central
        run: |
          mvn --batch-mode \
          $TRAIN_ARGS clean deploy -P release,central-portal
        env:
          # builds the bundle and does not upload it. '-DskipUpload' is for a POM which
          # configures the plugin without the property of release-parent
          TRAIN_ARGS: "${{ inputs.train != '' && '-Dcentral.skip.upload=true -DskipUpload=true' || '' }}"
          # maven-gpg-plugin 3.2 reads the passphrase from this variable. Passing it as
          # -Dgpg.passphrase is deprecated since 3.2
          MAVEN_GPG_PASSPHRASE: "${{ secrets.MAVEN_GPG_PASSPHRASE }}"
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
          # like every other Maven build of this repository
          CI: false
      - name: Pack the bundle for the release train
        if: inputs.train != ''
        env:
          TRAIN: "${{ inputs.train }}"
          LINE: "main"
          VERSION: "${{ inputs.release_version }}"
        run: bash "$RUNNER_TEMP/release-train.sh" pack "$TRAIN" "$LINE" "$VERSION"
      - name: Keep the bundle for the release train
        if: inputs.train != ''
        uses: actions/upload-artifact@v7
        with:
          # one name per repository and line: a new build of the same line replaces the old
          # one, and release-train.yaml takes the newest
          name: "release-train-${{ inputs.train }}-${{ github.event.repository.name }}-main"
          path: "${{ runner.temp }}/release-train/"
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Upload the test reports of a failed release
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit release version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Prepare release v${{ github.event.inputs.release_version }}"
      - name: Create Git tag
        run: |
          if [ -n "$TRAIN" ] && git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            # nothing of a train is on Maven Central before release-train.yaml uploads it, so
            # a fix released under the same version may move the tag
            echo "::warning::Tag $VERSION exists already. The release train '$TRAIN' moves it to this build."
            git tag -f -a "$VERSION" -m "Release $VERSION"
            git push --force origin "refs/tags/$VERSION"
          else
            git tag -a "${{ github.event.inputs.release_version }}" -m "Release ${{ github.event.inputs.release_version }}"
            git push origin --tags
          fi
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ github.event.inputs.release_version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.release_version }}"
          name: "v${{ github.event.inputs.release_version }}"
          generate_release_notes: true
          append_body: |2

            **Full Changelog:** [`${{ env.LAST_RELEASED_VERSION }}...${{ github.event.inputs.release_version }}`](https://github.com/vanillabp/camunda7-adapter/compare/${{ env.LAST_RELEASED_VERSION }}...${{ github.event.inputs.release_version }})
          draft: true
      - name: Calculate next snapshot version
        run: |
          # raises the patch and keeps what follows the first dash, so 2.0.0 becomes
          # 2.0.1-SNAPSHOT
          if [[ ! "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not of the form 1.2.3 or 1.2.3-<suffix>"
            exit 1
          fi
          NEXT_SNAPSHOT="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))${BASH_REMATCH[4]}-SNAPSHOT"
          echo "Next snapshot version: $NEXT_SNAPSHOT"
          echo "NEXT_SNAPSHOT=$NEXT_SNAPSHOT" >> "$GITHUB_ENV"
        env:
          RELEASE_VERSION: "${{ github.event.inputs.release_version }}"
      - name: Set next snapshot version
        run: |
          mvn --batch-mode --update-snapshots versions:set -DprocessAllModules=true -DnewVersion=${{ env.NEXT_SNAPSHOT }}
          find . -name pom.xml.versionsBackup -delete
          mvn --batch-mode --update-snapshots -DskipTests -DskipITs package
      - name: Commit next snapshot version
        run: |
          git add -A
          git commit -m "Set next version ${{ env.NEXT_SNAPSHOT }}"
          if [ -n "$TRAIN" ] && git ls-remote --exit-code --heads origin "release/$VERSION" > /dev/null; then
            echo "::warning::Branch release/$VERSION exists already. The release train '$TRAIN' replaces it with this build."
            git push --force origin "HEAD:release/$VERSION"
          else
            git push origin HEAD:release/${{ github.event.inputs.release_version }}
          fi
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ github.event.inputs.release_version }}"
      - name: Create PR to merge release branch into main
        run: |
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
          if [ -n "$TRAIN" ] && [ -n "$(gh pr list --head "release/$VERSION" --state open --json number --jq '.[].number')" ]; then
            echo "::warning::The pull request of release/$VERSION is open already. The release train '$TRAIN' reuses it."
            exit 0
          fi
          gh pr create \
            --title "Merge release/${{ github.event.inputs.release_version }} into main" \
            --body "Automated PR to merge release branch." \
            --base main \
            --head release/${{ github.event.inputs.release_version }}
        env:
          TRAIN: "${{ inputs.train }}"
          VERSION: "${{ github.event.inputs.release_version }}"
